name: SmartNetEnergy MLOps Pipeline - Secured

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: smartnetenergycr.azurecr.io
  IMAGE_NAME: smartnetenergy-api

jobs:
  test:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install fastapi uvicorn pydantic numpy scikit-learn joblib httpx pytest python-jose python-multipart

      - name: Run security tests
        working-directory: ./api
        env:
          API_KEY_ADMIN: ${{ secrets.API_KEY_ADMIN }}
          API_KEY_ENGINEER: ${{ secrets.API_KEY_ENGINEER }}
          API_KEY_READONLY: ${{ secrets.API_KEY_READONLY }}
        run: pytest tests/ -v

  build:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: smartnetenergycr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        run: |
          docker build ./api -t smartnetenergycr.azurecr.io/smartnetenergy-api:${{ github.sha }}
          docker build ./api -t smartnetenergycr.azurecr.io/smartnetenergy-api:latest
          docker push smartnetenergycr.azurecr.io/smartnetenergy-api:${{ github.sha }}
          docker push smartnetenergycr.azurecr.io/smartnetenergy-api:latest

  deploy:
    name: Deploy Secured API
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Add secrets to Container App first
        run: |
          az containerapp secret set \
            --name smartnetenergy-api \
            --resource-group rg-smartnetenergy \
            --secrets \
              api-key-admin="${{ secrets.API_KEY_ADMIN }}" \
              api-key-engineer="${{ secrets.API_KEY_ENGINEER }}" \
              api-key-readonly="${{ secrets.API_KEY_READONLY }}"

      - name: Deploy with secrets injection
        run: |
          az containerapp update \
            --name smartnetenergy-api \
            --resource-group rg-smartnetenergy \
            --image smartnetenergycr.azurecr.io/smartnetenergy-api:${{ github.sha }} \
            --set-env-vars \
              API_KEY_ADMIN=secretref:api-key-admin \
              API_KEY_ENGINEER=secretref:api-key-engineer \
              API_KEY_READONLY=secretref:api-key-readonly \
              RATE_LIMIT_PER_MIN=60

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Status
        run: echo "Pipeline status ${{ job.status }}"
